services:
  postgres:
    image: postgres:15
    container_name: mahosample-postgres
    environment:
      POSTGRES_DB: mahosample
      POSTGRES_USER: mahosample
      POSTGRES_PASSWORD: mahosample
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahosample -d mahosample"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

