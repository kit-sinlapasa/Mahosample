databases:
  - name: mahosample-postgres
    databaseName: mahosample
    user: mahosample
    plan: free

services:
  - type: web
    name: mahosample-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mahosample-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: THAILAND_POST_API_TOKEN
        sync: false

  - type: web
    name: mahosample-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: mahosample-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
